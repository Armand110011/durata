[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "durata"
version = "0.3.1"
description = "Tiny, dependency-free parser for human-friendly durations."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "durata contributors" }]
keywords = ["duration", "parse", "time", "humanize"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/OWNER/durata"
Issues = "https://github.com/OWNER/durata/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/durata"]

[tool.pytest.ini_options]
pythonpath = ["src"]
